name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Buat proyek Android
        run: npx cap add android
      - name: Ikon aplikasi
        run: npx @capacitor/assets generate --android || true
      - name: Layar penuh + landscape
        run: |
          python3 - <<'PY'
          import re
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read().replace('<activity','<activity android:screenOrientation="sensorLandscape"',1)
          open(m,'w').write(s)
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          s=re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)',r'\1\n        <item name="android:windowFullscreen">true</item>',s,1)
          open(p,'w').write(s)
          PY
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Machi-Iro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
