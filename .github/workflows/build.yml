name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GODOT_VERSION: 4.4.1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project dari zip
        run: |
          Z=$(ls *Hoshi*.zip | head -n1)
          echo "Zip: $Z"
          mkdir -p work && unzip -q "$Z" -d work
          P=$(dirname "$(find work -name project.godot | head -n1)")
          echo "Project: $P"
          echo "PROJ=$P" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot + export templates
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O g.zip
          wget -q $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O t.zip
          unzip -q g.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q t.zip -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $PWD/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"$PWD/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.4.tres

      - name: Export APK
        run: |
          cd "$PROJ"
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/HoshiNoSato.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: HoshiNoSato-apk
          path: ${{ env.PROJ }}/build/HoshiNoSato.apk
